[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackstage"
version = "2.0.0"
description = "Automated DJ music library management with audio intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "velvetvex" }]

dependencies = [
    "mutagen>=1.47",
    "thefuzz[speedup]>=0.20",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
analysis = [
    "essentia>=2.1b6",
    "essentia-tensorflow>=2.1b6",
]

[project.scripts]
trackstage = "trackstage.pipeline:main"

[project.urls]
Repository = "https://github.com/velvetvex/trackstage"

[tool.hatch.build.targets.wheel]
packages = ["trackstage"]
